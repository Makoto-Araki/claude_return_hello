apiVersion: v1
kind: Namespace
metadata:
  name: claude-sample
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello-cronjob
  namespace: claude-sample
  labels:
    app: hello
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: hello
        spec:
          containers:
            - name: hello
              image: claude-return-hello:latest
              imagePullPolicy: Never
              resources:
                requests:
                  cpu: "10m"
                  memory: "16Mi"
                limits:
                  cpu: "50m"
                  memory: "32Mi"
          restartPolicy: OnFailure
