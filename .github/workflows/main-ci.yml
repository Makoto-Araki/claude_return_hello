name: Main CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t claude-return-hello:latest .

      - name: Trivy scan (report HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: claude-return-hello:latest
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: claude-return-hello:latest
          format: table
          severity: CRITICAL
          exit-code: '1'
