name: PR Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -q

      - name: Build image
        run: docker build -t claude-return-hello:pr-check .

      - name: Verify container runs as non-root
        run: |
          uid=$(docker run --rm claude-return-hello:pr-check id -u)
          echo "Container UID: $uid"
          test "$uid" != "0"
